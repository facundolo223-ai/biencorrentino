<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>R&S MARKET POS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo-box {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #ea580c, #dc2626);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(234, 88, 12, 0.4);
      font-size: 42px;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
      max-width: 280px;
    }
    .loader {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ea580c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      background: #ea580c;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 8px 20px rgba(234, 88, 12, 0.35);
      border: none;
      cursor: pointer;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .offline-box {
      display: none;
    }
  </style>
</head>
<body>
  <div class="logo-box">🛒</div>
  <h1>R&S MARKET</h1>
  <p>Conectando al Punto de Venta en la Nube...</p>
  
  <div class="loader" id="spinner"></div>

  <div class="offline-box" id="offline-box">
    <p style="color: #f87171; font-weight: 600;">No se pudo conectar con el servidor.</p>
    <button class="btn" onclick="retryConnection()">Reintentar Conexión</button>
  </div>

  <script>
    const TARGET_URL = "https://rsmarket-production.up.railway.app";

    function checkAndRedirect() {
      fetch(TARGET_URL + "/api/auth/current", { method: 'GET', cache: 'no-store' })
        .then(response => {
          if (response.ok || response.status === 401 || response.status === 200) {
            window.location.href = TARGET_URL;
          } else {
            showOffline();
          }
        })
        .catch(() => {
          // Intentar redirección directa
          window.location.href = TARGET_URL;
        });
    }

    function showOffline() {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('offline-box').style.display = 'block';
    }

    function retryConnection() {
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('offline-box').style.display = 'none';
      checkAndRedirect();
    }

    // Iniciar redirección de inmediato
    checkAndRedirect();
  </script>
</body>
</html>
